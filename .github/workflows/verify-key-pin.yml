# 증거 봉인 검증키 핀 — '예상 밖 키'가 배포되면 조기에 실패한다.
#
# 왜 cron 인가: 키 대입(substitution)은 배포 순간에 조용히 일어난다. PR 검사만으로는
# 운영 중 교체를 못 잡으므로 주기적으로 /health 의 지문·세대를 핀 파일과 대조한다.
#
# 서드파티 액션을 쓰지 않는다(전부 full commit SHA 로 고정해야 하는 대상이므로 아예 배제하고
# curl + 표준 라이브러리만 쓴다 — tj-actions 사건에서 배운 것).
name: verify-key-pin

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-key-pin.yml"
      - ".github/scripts/verify_key_pin.py"

permissions:
  contents: read

concurrency:
  group: verify-key-pin
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 검증 스크립트 가져오기
        env:
          GH_TOKEN: ${{ github.token }}
          # PR head sha 를 쓰지 않는다: 검증 코드를 PR 작성자가 공급하면 게이트를 스스로 무력화할 수 있다.
          # 이 워크플로에는 pull_request 트리거가 없으므로 github.sha(= 트리거된 ref)만 쓴다.
          PIN_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/verify_key_pin.py?ref=${PIN_REF}" \
            -o .ci/verify_key_pin.py

      # 검증 코드 무결성: 스크립트를 저장소에서 런타임에 받아 실행하므로 해시를 고정한다.
      # 미설정이면 **경고만**(가용성 우선 — 이 커밋 머지 직후부터 cron 이 계속 빨강이 되지 않게).
      # 설정됐는데 불일치하면 fail-closed(exit 1). 값 등록 절차:
      #   sha256sum .github/scripts/verify_key_pin.py
      #   gh variable set EVIDENCE_CI_SCRIPT_SHA --body <위 해시> --repo <owner>/<repo>
      # 스크립트를 고칠 때마다 이 변수를 갱신해야 한다(안 하면 다음 실행이 fail-closed 로 멈춘다).
      - name: 검증 스크립트 무결성 대조(sha256)
        env:
          EVIDENCE_CI_SCRIPT_SHA: ${{ vars.EVIDENCE_CI_SCRIPT_SHA }}
        run: |
          set -euo pipefail
          actual="$(sha256sum .ci/verify_key_pin.py | awk '{print $1}')"
          if [ -z "${EVIDENCE_CI_SCRIPT_SHA:-}" ]; then
            echo "::warning::vars.EVIDENCE_CI_SCRIPT_SHA 미설정 — 해시를 대조하지 않습니다(실제 sha256=$actual). 등록: gh variable set EVIDENCE_CI_SCRIPT_SHA --body $actual"
          elif [ "$actual" != "$EVIDENCE_CI_SCRIPT_SHA" ]; then
            echo "::error::검증 스크립트 sha256 불일치 — fail-closed(실제=$actual 기대=$EVIDENCE_CI_SCRIPT_SHA)"
            exit 1
          else
            echo "검증 스크립트 sha256 일치: $actual"
          fi

      # 기대값은 **Actions 변수**에서 읽는다(공개키·지문이라도 저장소 파일로는 두지 않는다).
      # 변수가 비면 스크립트가 fail-closed 로 실패한다(health_url 은 기본 호스트로 대체하지 않는다).
      - name: 런타임 지문·세대 대조
        run: |
          python3 .ci/verify_key_pin.py \
            --expected-fingerprint "${{ vars.EVIDENCE_PIN_FINGERPRINT }}" \
            --expected-generation "${{ vars.EVIDENCE_PIN_GENERATION }}" \
            --expected-key-id "${{ vars.EVIDENCE_PIN_KEY_ID }}" \
            --health-url "${{ vars.EVIDENCE_PIN_HEALTH_URL }}"
